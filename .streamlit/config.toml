[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7c8cf8"
backgroundColor = "#0b0f1a"
secondaryBackgroundColor = "#141a2b"
textColor = "#e8ecf8"