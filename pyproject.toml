[project]
name = "cosmorelic"
version = "0.1.0"
description = "Ask 8 abandoned space missions about their final days; every number labelled by how we know it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "openai>=1.50",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

# Development-only tooling. Kept as optional extras (not the default group) so
# deploy targets — Streamlit Community Cloud runs `uv sync` against uv.lock —
# install the four runtime libraries and nothing else.
[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "nbformat>=5.9",
    "python-pptx>=0.6.23",
    "websocket-client>=1.7",
]

[tool.uv]
package = false
